<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARS AGENCY - VJ Activity Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #161616;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --border-color: #2a2a2a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 20px 80px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            padding-top: 15px;
        }

        .logo-img-container {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            margin: 0 auto 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .logo-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 2px;
            color: var(--gold);
            margin-bottom: 4px;
        }

        .header p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .dashboard-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 5px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold-light);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 18px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            border-color: var(--gold);
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .activity-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            transition: border-color 0.2s;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .activity-card:hover {
            border-color: rgba(212, 175, 55, 0.4);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .pk-match-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .vj-profile-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
            gap: 8px;
        }

        .profile-avatar {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-placeholder-cute {
            font-size: 26px;
            color: var(--gold);
            font-weight: 600;
            background: radial-gradient(circle, rgba(212,175,55,0.15) 0%, rgba(0,0,0,0.5) 100%);
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vs-badge {
            font-size: 14px;
            font-weight: 700;
            color: var(--gold);
            padding: 0 10px;
            letter-spacing: 1px;
        }

        .vj-info-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 100%;
        }

        .vj-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--gold-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .vj-id-row {
            font-size: 12px;
            color: #aaa;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .activity-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .act-pk-battle { background-color: #1a3a6b; color: #d0e1fd; border: 1px solid #3b71ca; }
        .act-super-pk { background-color: #58181f; color: #ffccd2; border: 1px solid #9c2732; }
        .act-family-pk { background-color: #3b1f58; color: #e5ccff; border: 1px solid #7a329c; }
        .act-default { background-color: #2a2a2a; color: #ccc; border: 1px solid #444; }

        .agency-tag {
            font-size: 11px;
            color: #2ecc71;
            background: rgba(46, 204, 113, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            display: inline-block;
            margin-top: 2px;
        }

        .status-badge {
            display: block;
            width: 100%;
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
        }

        .status-success { background: rgba(40, 167, 69, 0.2); color: #28a745; border: 1px solid rgba(40, 167, 69, 0.4); }
        .status-scheduled { background: rgba(23, 162, 184, 0.2); color: #17a2b8; border: 1px solid rgba(23, 162, 184, 0.4); }
        .status-waiting { background: rgba(255, 193, 7, 0.2); color: #ffc107; border: 1px solid rgba(255, 193, 7, 0.4); }
        .status-failed { background: rgba(255, 75, 75, 0.2); color: #ff5252; border: 1px solid rgba(255, 75, 75, 0.4); }

        .copy-btn {
            background: transparent;
            border: none;
            color: var(--gold);
            cursor: pointer;
            font-size: 12px;
            padding: 2px 4px;
            border-radius: 4px;
        }
        .copy-btn:hover { background: rgba(212, 175, 55, 0.15); }

        .external-links-section {
            margin-top: 35px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .section-title {
            font-size: 14px;
            color: var(--gold);
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .external-link-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.2s;
        }

        .external-link-card:hover {
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.03);
        }

        .external-link-name {
            font-size: 13.5px;
            font-weight: 500;
            color: var(--gold-light);
        }

        .external-link-icon {
            font-size: 12px;
            color: var(--text-muted);
        }

        .floating-line-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #06c755;
            color: white;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(6, 199, 85, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
            transition: transform 0.2s;
        }

        .floating-line-btn:hover {
            transform: scale(1.05);
        }

        .loading-text, .no-data {
            text-align: center;
            color: var(--text-muted);
            padding: 30px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo-img-container">
                <img src="marslogo.jpg" alt="MARS Agency Logo" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'75\' height=\'75\'><rect width=\'75\' height=\'75\' fill=\'%23000\'/><text x=\'50%\' y=\'50%\' font-size=\'18\' fill=\'%23d4af37\' text-anchor=\'middle\' dominant-baseline=\'central\' font-family=\'sans-serif\'>MARS</text></svg>';">
            </div>
            <h1>MARS AGENCY</h1>
            <p>ระบบติดตามสถานะและตารางกิจกรรม VJ</p>
        </div>

        <div class="dashboard-tabs">
            <button class="tab-btn active" onclick="switchTab('today', event)">📅 กิจกรรมวันนี้</button>
            <button class="tab-btn" onclick="switchTab('latest', event)">⚡ กิจกรรมล่าสุด</button>
            <button class="tab-btn" onclick="switchTab('archive', event)">📂 คลังย้อนหลัง</button>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 ค้นหาด้วยชื่อ VJ หรือ Bigo ID..." onkeyup="filterCards()">
        </div>

        <div class="card-list" id="cardList">
            <div class="loading-text">กำลังโหลดข้อมูลจากระบบ... ⏳</div>
        </div>

        <div class="external-links-section">
            <div class="section-title">📌 ลิงก์กิจกรรมและช่องทางสมัครเพิ่มเติม</div>
            <div class="links-grid" id="externalLinksContainer">
                <div style="font-size: 12px; color: var(--text-muted); text-align: center; padding: 10px;">กำลังโหลดลิงก์กิจกรรม...</div>
            </div>
        </div>
    </div>

    <a href="https://line.me/ti/p/~your_line_id" target="_blank" class="floating-line-btn" id="lineContactBtn">
        💬 ติดต่อแอดมิน
    </a>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzoyxPdf9LYOOXsM3-oLHYPsXfINY_U5DvKL-XxJuBImsHo2lENVPzw10V_JlWuR1lNoA/exec";

        let allActivities = [];
        let externalLinks = [];
        let currentTab = 'today';

        async function loadData() {
            try {
                let response = await fetch(API_URL);
                let data = await response.json();
                
                let rawActivities = Array.isArray(data) ? data : (data.activities || []);
                allActivities = rawActivities.slice().reverse();
                
                externalLinks = data.externalLinks || [];

                renderCurrentTab();
                renderExternalLinks();
            } catch (error) {
                console.error("เกิดข้อผิดพลาดในการโหลดข้อมูล: ", error);
                document.getElementById("cardList").innerHTML = `<div class="no-data" style="color: #ff5252;">⚠️ ไม่สามารถโหลดข้อมูลได้ กรุณาตรวจสอบการเชื่อมต่อ</div>`;
            }
        }

        function switchTab(tabName, event) {
            currentTab = tabName;
            
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if(event && event.target) {
                event.target.classList.add('active');
            }

            renderCurrentTab();
        }

        function renderCurrentTab() {
            let today = new Date();
            today.setHours(0, 0, 0, 0);

            let filteredData = [];

            if (currentTab === 'today') {
                filteredData = allActivities.filter(item => {
                    if (!item.Date) return false;
                    let eventDate = new Date(item.Date);
                    eventDate.setHours(0, 0, 0, 0);
                    return eventDate.getTime() === today.getTime();
                });
            } else if (currentTab === 'latest') {
                filteredData = allActivities.filter(item => {
                    if (!item.Date) return false;
                    let eventDate = new Date(item.Date);
                    return eventDate >= today;
                });
                if(filteredData.length === 0 && allActivities.length > 0) {
                    filteredData = [allActivities[0]];
                }
            } else if (currentTab === 'archive') {
                filteredData = allActivities.filter(item => {
                    if (!item.Date) return false;
                    let eventDate = new Date(item.Date);
                    return eventDate < today;
                });
            }

            renderCards(filteredData);
        }

        function formatDate(dateString) {
            if (!dateString) return '-';
            try {
                let d = new Date(dateString);
                if (isNaN(d.getTime())) return dateString;
                return d.toLocaleDateString('th-TH', { 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric' 
                });
            } catch (e) {
                return dateString;
            }
        }

        function formatTime(timeString) {
            if (!timeString) return '-';
            try {
                let d = new Date(timeString);
                if (!isNaN(d.getTime())) {
                    let hours = String(d.getHours()).padStart(2, '0');
                    let minutes = String(d.getMinutes()).padStart(2, '0');
                    if (hours !== '00' || minutes !== '00') {
                        return `${hours}:${minutes} น.`;
                    }
                }
                return timeString;
            } catch (e) {
                return timeString;
            }
        }

        function getActivityClass(activityName) {
            if (!activityName) return 'act-default';
            let name = activityName.toLowerCase();
            if (name.includes('battle royal')) return 'act-pk-battle';
            if (name.includes('super pk')) return 'act-super-pk';
            if (name.includes('family')) return 'act-family-pk';
            return 'act-default';
        }

        function getStatusInfo(status) {
            if (!status) return { text: 'รออัปเดต', class: 'status-waiting' };
            let s = status.trim();
            if (s.includes('สำเร็จ')) return { text: s, class: 'status-success' };
            if (s.includes('ได้ตารางแล้ว')) return { text: s, class: 'status-scheduled' };
            if (s.includes('ลงทะเบียนแล้ว') || s.includes('รอ')) return { text: s, class: 'status-waiting' };
            return { text: s, class: 'status-failed' };
        }

        function renderCards(data) {
            let cardList = document.getElementById("cardList");
            cardList.innerHTML = "";

            if (data.length === 0) {
                let emptyMsg = "ยังไม่มีคำขอลงกิจกรรมในวันนี้";
                if(currentTab === 'latest') emptyMsg = "ไม่มีกิจกรรมล่าสุดในขณะนี้";
                if(currentTab === 'archive') emptyMsg = "ยังไม่มีประวัติกิจกรรมในคลังย้อนหลัง";

                cardList.innerHTML = `<div class="no-data">📌 ${emptyMsg}</div>`;
                return;
            }

            data.forEach(item => {
                let actClass = getActivityClass(item.ActivityName);
                let statusInfo = getStatusInfo(item.Status);
                let formattedDate = formatDate(item.Date);
                let formattedTime = formatTime(item.Time);
                
                let ourAvatarHTML = (item.OurImage && String(item.OurImage).trim().length > 5)
                    ? `<img src="${item.OurImage}" alt="Our VJ">` 
                    : `<div class="avatar-placeholder-cute">?</div>`;

                let oppAvatarHTML = (item.OpponentImage && String(item.OpponentImage).trim().length > 5)
                    ? `<img src="${item.OpponentImage}" alt="Opponent VJ">` 
                    : `<div class="avatar-placeholder-cute">?</div>`;

                let cardHTML = `
                    <div class="activity-card">
                        <div class="card-top">
                            <span class="activity-badge ${actClass}">${item.ActivityName || 'กิจกรรมทั่วไป'}</span>
                            <span style="font-size: 11px; color: var(--text-muted);">${formattedDate} | ${formattedTime}</span>
                        </div>

                        <div class="pk-match-container">
                            <div class="vj-profile-side">
                                <div class="profile-avatar">${ourAvatarHTML}</div>
                                <div class="vj-info-details">
                                    <div class="vj-name" title="${item.Name || '-'}">${item.Name || '-'}</div>
                                    <div class="vj-id-row">
                                        ID: ${item.BigoID || '-'} 
                                        ${item.BigoID ? `<button class="copy-btn" onclick="copyToClipboard('${item.BigoID}', this)" title="คัดลอก VJ ID">📋</button>` : ''}
                                    </div>
                                    <span class="agency-tag">MARS Agency</span>
                                </div>
                            </div>

                            <div class="vs-badge">VS</div>

                            <div class="vj-profile-side">
                                <div class="profile-avatar">${oppAvatarHTML}</div>
                                <div class="vj-info-details">
                                    <div class="vj-name" title="${item.OpponentName || 'คู่แข่ง'}">${item.OpponentName || 'คู่แข่ง'}</div>
                                    <div class="vj-id-row">
                                        ID: ${item.OpponentID || '-'} 
                                        ${item.OpponentID ? `<button class="copy-btn" onclick="copyToClipboard('${item.OpponentID}', this)" title="คัดลอก ID คู่แข่ง">📋</button>` : ''}
                                    </div>
                                    <span class="agency-tag" style="color: #f39c12; background: rgba(243, 156, 18, 0.1);">${item.OpponentAgency || 'ระบุสังกัด'}</span>
                                </div>
                            </div>
                        </div>

                        <div class="card-bottom-grid">
                            <div class="status-badge ${statusInfo.class}">
                                ${statusInfo.text}
                            </div>
                        </div>
                    </div>
                `;
                cardList.innerHTML += cardHTML;
            });
        }

        // 7. เรนเดอร์ลิงก์ภายนอก (External Links)
        function renderExternalLinks() {
            let container = document.getElementById("externalLinksContainer");
            if (!container) return;
            container.innerHTML = "";

            // ตรวจสอบว่ามีข้อมูล externalLinks และเป็น Array หรือไม่
            if (!externalLinks || !Array.isArray(externalLinks) || externalLinks.length === 0) {
                container.innerHTML = `<div style="font-size: 12px; color: var(--text-muted); text-align: center; padding: 10px;">ยังไม่มีลิงก์กิจกรรมเพิ่มเติม</div>`;
                return;
            }

            externalLinks.forEach(link => {
                // ป้องกันกรณีชื่อหรือยูอาร์แอลเป็นค่าว่าง
                let linkName = link.name || link.Name || 'ลิงก์กิจกรรม';
                let linkUrl = link.url || link.URL || '#';

                let linkHTML = `
                    <a href="${linkUrl}" target="_blank" class="external-link-card">
                        <span class="external-link-name">🔗 ${linkName}</span>
                        <span class="external-link-icon">เปิดดู ➔</span>
                    </a>
                `;
                container.innerHTML += linkHTML;
            });
        }

        function filterCards() {
            let keyword = document.getElementById("searchInput").value.toLowerCase();
            let filtered = allActivities.filter(item => {
                let name = (item.Name || '').toLowerCase();
                let id = (item.BigoID || '').toLowerCase();
                let oppName = (item.OpponentName || '').toLowerCase();
                let oppId = (item.OpponentID || '').toLowerCase();
                return name.includes(keyword) || id.includes(keyword) || oppName.includes(keyword) || oppId.includes(keyword);
            });
            renderCards(filtered);
        }

        function copyToClipboard(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                let originalHTML = btn.innerHTML;
                btn.innerHTML = "✅";
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                }, 1200);
            }).catch(err => {
                console.error('คัดลอกไม่สำเร็จ: ', err);
            });
        }

        window.onload = loadData;
    </script>
</body>
</html>
