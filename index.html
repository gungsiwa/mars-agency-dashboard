<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARS AGENCY - VJ Activity Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 27, 39, 0.85);
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #f0f0f0;
            --text-muted: #8b9bb4;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 20px 80px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* ธีมพื้นหลังอวกาศและละอองดาวเคลื่อนไหวเบาๆ */
        .space-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(59, 113, 202, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                linear-gradient(135deg, #05070c 0%, #0d111a 50%, #05070c 100%);
            z-index: -2;
        }

        /* เอฟเฟกต์ดาวระยิบระยับจางๆ */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(white 1px, transparent 0);
            background-size: 50px 50px;
            opacity: 0.15;
            z-index: -1;
            animation: moveStars 60s linear infinite;
            pointer-events: none;
        }

        @keyframes moveStars {
            from { background-position: 0 0; }
            to { background-position: 1000px 1000px; }
        }

        .container {
            width: 100%;
            max-width: 650px;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-top: 10px;
        }

        .logo-img-container {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            margin: 0 auto 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .logo-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 2px;
            color: var(--gold);
            margin-bottom: 4px;
        }

        .header p {
            font-size: 12px;
            color: var(--text-muted);
        }

         /* ป้ายประกาศด่วน (Notice Banner) แบบข้อความวิ่ง */
         .notice-banner {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15) 0%, rgba(22, 27, 39, 0.9) 100%);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 13px;
            color: var(--gold-light);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
        }

        .notice-icon {
            font-size: 16px;
            flex-shrink: 0;
            z-index: 2;
            background: rgba(22, 27, 39, 0.8);
            padding-right: 5px;
        }

        /* ทำให้ข้อความวิ่งอย่างนุ่มนวล */
        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
        }

        .marquee-text {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 20s linear infinite;
        }

        /* หยุดวิ่งชั่วคราวเมื่อเอาเมาส์ไปชี้หรือใช้นิ้วแตะ */
        .marquee-container:hover .marquee-text {
            animation-play-state: paused;
        }

        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }   

        .notice-text {
            flex: 1;
            line-height: 1.4;
        }

        /* เวลาอัปเดตล่าสุด */
        .last-updated-box {
            text-align: right;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 12px;
            padding-right: 4px;
        }

        .dashboard-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 5px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold-light);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 18px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
            backdrop-filter: blur(10px);
        }

        .search-box input:focus {
            border-color: var(--gold);
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .activity-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            transition: border-color 0.2s;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
        }

        .activity-card:hover {
            border-color: rgba(212, 175, 55, 0.4);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        /* ดีไซน์แบ่งข้าง PK (ซ้ายทอง - ขวาฟ้า) */
        .pk-match-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.04) 0%, rgba(15, 20, 30, 0.8) 50%, rgba(59, 113, 202, 0.06) 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }

        .pk-match-container::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 45%;
            background: radial-gradient(circle at left, rgba(212, 175, 55, 0.07) 0%, transparent 70%);
            pointer-events: none;
        }

        .pk-match-container::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 45%;
            background: radial-gradient(circle at right, rgba(59, 113, 202, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .vj-profile-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
            gap: 8px;
            z-index: 1;
        }

        .profile-avatar {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            position: relative;
        }

        .vj-profile-side.opponent-side .profile-avatar {
            border-color: #3b71ca;
            box-shadow: 0 4px 12px rgba(59, 113, 202, 0.25);
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .avatar-placeholder-cute {
            font-size: 26px;
            color: var(--gold);
            font-weight: 600;
            background: radial-gradient(circle, rgba(212,175,55,0.15) 0%, rgba(0,0,0,0.5) 100%);
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vs-badge {
            font-size: 14px;
            font-weight: 700;
            color: var(--gold-light);
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.3);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            letter-spacing: 0.5px;
            margin: 0 4px;
        }

        .vj-info-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 100%;
        }

        .vj-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--gold-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .vj-id-row {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .activity-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11.5px;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .act-pk-battle { background-color: rgba(26, 58, 107, 0.7); color: #d0e1fd; border: 1px solid #3b71ca; }
        .act-super-pk { background-color: rgba(88, 24, 31, 0.7); color: #ffccd2; border: 1px solid #9c2732; }
        .act-family-pk { background-color: rgba(59, 31, 88, 0.7); color: #e5ccff; border: 1px solid #7a329c; }
        .act-default { background-color: rgba(42, 42, 42, 0.7); color: #ccc; border: 1px solid #444; }

        .agency-tag {
            font-size: 11px;
            color: #2ecc71;
            background: rgba(46, 204, 113, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            display: inline-block;
            margin-top: 2px;
        }

        .status-badge {
            display: block;
            width: 100%;
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
        }

        .status-success { background: rgba(40, 167, 69, 0.2); color: #28a745; border: 1px solid rgba(40, 167, 69, 0.4); }
        .status-scheduled { background: rgba(23, 162, 184, 0.2); color: #17a2b8; border: 1px solid rgba(23, 162, 184, 0.4); }
        .status-waiting { background: rgba(255, 193, 7, 0.2); color: #ffc107; border: 1px solid rgba(255, 193, 7, 0.4); }
        .status-failed { background: rgba(255, 75, 75, 0.2); color: #ff5252; border: 1px solid rgba(255, 75, 75, 0.4); }

        .copy-btn {
            background: transparent;
            border: none;
            color: var(--gold);
            cursor: pointer;
            font-size: 12px;
            padding: 2px 4px;
            border-radius: 4px;
        }
        .copy-btn:hover { background: rgba(212, 175, 55, 0.15); }

        /* กล่องข้อความติดต่อแอดมิน (แบบสั้นกระชับ) เหนือลิงก์กิจกรรม */
        .admin-contact-card {
            background: var(--card-bg);
            border: 1px solid rgba(6, 199, 85, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-top: 35px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .admin-contact-info h3 {
            font-size: 13.5px;
            color: #25d366;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .admin-contact-info p {
            font-size: 11.5px;
            color: var(--text-muted);
        }

        .admin-action-btn {
            background-color: #06c755;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
            transition: transform 0.2s;
            box-shadow: 0 2px 10px rgba(6, 199, 85, 0.3);
        }

        .admin-action-btn:hover {
            transform: scale(1.03);
        }

        /* ส่วนลิงก์กิจกรรมเพิ่มเติมแบบย่อขนาดให้กะทัดรัด */
        .external-links-section {
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .section-title {
            font-size: 12.5px;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .external-link-card {
            background-color: rgba(22, 27, 39, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.2s;
        }

        .external-link-card:hover {
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.03);
        }

        .external-link-name {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-main);
        }

        .external-link-icon {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ปุ่มลอยติดต่อแอดมินมุมขวาล่าง */
        .floating-line-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #06c755;
            color: white;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(6, 199, 85, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
            transition: transform 0.2s;
        }

        .floating-line-btn:hover {
            transform: scale(1.05);
        }

        .loading-text, .no-data {
            text-align: center;
            color: var(--text-muted);
            padding: 30px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- พื้นหลังอวกาศและละอองดาว -->
    <div class="space-bg"></div>
    <div class="stars-container"></div>

    <div class="container">
        <div class="header">
            <div class="logo-img-container">
                <img src="marslogo.jpg" alt="MARS Agency Logo" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'75\' height=\'75\'><rect width=\'75\' height=\'75\' fill=\'%23000\'/><text x=\'50%\' y=\'50%\' font-size=\'18\' fill=\'%23d4af37\' text-anchor=\'middle\' dominant-baseline=\'central\' font-family=\'sans-serif\'>MARS</text></svg>';">
            </div>
            <h1>MARS AGENCY</h1>
            <p>ระบบติดตามสถานะและตารางกิจกรรม VJ</p>
        </div>

        <!-- ป้ายประกาศด่วน (ดึงจากชีต Announcement) -->
        <div id="noticeBannerContainer"></div>

        <!-- เวลาอัปเดตข้อมูลล่าสุด -->
        <div class="last-updated-box" id="lastUpdatedBox">อัปเดตล่าสุด: กำลังโหลด...</div>

        <div class="dashboard-tabs">
            <button class="tab-btn active" onclick="switchTab('today', event)">📅 กิจกรรมวันนี้</button>
            <button class="tab-btn" onclick="switchTab('archive', event)">📂 กิจกรรมย้อนหลัง</button>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 ค้นหาด้วยชื่อ VJ หรือ Bigo ID..." onkeyup="filterCards()">
        </div>

        <div class="card-list" id="cardList">
            <div class="loading-text">กำลังโหลดข้อมูลจากระบบ... ⏳</div>
        </div>

        <!-- กล่องข้อความติดต่อแอดมิน (แบบสั้นกระชับ) เหนือลิงก์กิจกรรม -->
        <div class="admin-contact-card">
            <div class="admin-contact-info">
                <h3>💬 ติดต่อแอดมินสังกัด MARS</h3>
                <p>ต้องการลงกิจกรรม แก้ไขตาราง หรือสอบถามข้อมูล</p>
            </div>
            <a href="https://line.me/ti/p/IG2mfqJhkb" target="_blank" class="admin-action-btn">แชทแอดมิน</a>
        </div>

        <!-- ลิงก์กิจกรรมเพิ่มเติม (ย่อขนาดให้กะทัดรัด) -->
        <div class="external-links-section">
            <div class="section-title">📌 ลิงก์กิจกรรมและช่องทางเพิ่มเติม</div>
            <div class="links-grid" id="externalLinksContainer">
                <div style="font-size: 11.5px; color: var(--text-muted); text-align: center; padding: 5px;">กำลังโหลดลิงก์...</div>
            </div>
        </div>
    </div>

    <!-- ปุ่มลอยติดต่อ LINE ด้านขวาล่าง -->
    <a href="https://line.me/ti/p/IG2mfqJhkb" target="_blank" class="floating-line-btn" id="lineContactBtn">
        💬 ติดต่อแอดมิน
    </a>

    <script>
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS-vZD57djEboAG1wlDYDcVQkK0p9xtLrbwv1LhMtfJRz7NJjsb0uHqq_y5UEgkS-9aZXwtpm-XqhD8/pub?gid=1314436716&single=true&output=csv";
        const ANNOUNCEMENT_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS-vZD57djEboAG1wlDYDcVQkK0p9xtLrbwv1LhMtfJRz7NJjsb0uHqq_y5UEgkS-9aZXwtpm-XqhD8/pub?gid=768921656&single=true&output=csv";

        let allActivities = [];
        let externalLinks = [];
        let currentTab = 'today';

        async function loadData() {
            // โหลดประกาศและเวลาอัปเดตจากชีต Announcement
            try {
                let annRes = await fetch(ANNOUNCEMENT_CSV_URL);
                let annText = await annRes.text();
                let annData = parseCSV(annText);
                if (annData.length > 0) {
                    let noticeText = annData[0]['NoticeText'] || '';
                    let lastUpdated = annData[0]['LastUpdated'] || '-';
                    
            // แสดงป้ายประกาศถ้ามีข้อความ
                let noticeContainer = document.getElementById("noticeBannerContainer");
                if (noticeText.trim()) {
                    noticeContainer.innerHTML = `
                        <div class="notice-banner">
                            <span class="notice-icon">📢</span>
                            <div class="marquee-container">
                                <div class="marquee-text">${noticeText}</div>
                            </div>
                        </div>
                    `;
                } else {
                    noticeContainer.innerHTML = "";
                }

                    // แสดงเวลาอัปเดตล่าสุด
                    document.getElementById("lastUpdatedBox").innerText = `อัปเดตข้อมูลล่าสุด: ${lastUpdated}`;
                }
            } catch (error) {
                console.error("ไม่สามารถโหลดข้อมูลประกาศได้: ", error);
                document.getElementById("lastUpdatedBox").innerText = `อัปเดตข้อมูลล่าสุด: -`;
            }

            // โหลดข้อมูลกิจกรรมหลัก
            try {
                let response = await fetch(SHEET_CSV_URL);
                let csvText = await response.text();
                
                allActivities = parseCSV(csvText);
                renderCurrentTab();
            } catch (error) {
                console.error("เกิดข้อผิดพลาดในการโหลดข้อมูลกิจกรรม: ", error);
                document.getElementById("cardList").innerHTML = `<div class="no-data" style="color: #ff5252;">⚠️ ไม่สามารถโหลดข้อมูลกิจกรรมได้</div>`;
            }

            // โหลดลิงก์เสริมภายนอก
            try {
                let linkRes = await fetch('links.json');
                externalLinks = await linkRes.json();
                renderExternalLinks();
            } catch (error) {
                console.error("ไม่สามารถโหลดไฟล์ links.json ได้: ", error);
                document.getElementById("externalLinksContainer").innerHTML = `<div style="font-size: 11.5px; color: var(--text-muted); text-align: center;">ยังไม่มีลิงก์เพิ่มเติม</div>`;
            }
        }

        function parseCSV(text) {
            let lines = text.split('\n');
            if (lines.length < 2) return [];

            let headers = parseCSVLine(lines[0]).map(h => h.trim());
            let result = [];

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                let currentLine = parseCSVLine(lines[i]);
                let obj = {};
                for (let j = 0; j < headers.length; j++) {
                    let key = headers[j];
                    obj[key] = currentLine[j] ? currentLine[j].trim() : '';
                }
                result.push(obj);
            }
            return result;
        }

        function parseCSVLine(text) {
            let result = [];
            let insideQuotes = false;
            let entry = '';
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (c === '"') {
                    insideQuotes = !insideQuotes;
                } else if (c === ',' && !insideQuotes) {
                    result.push(entry);
                    entry = '';
                } else {
                    entry += c;
                }
            }
            result.push(entry);
            return result.map(item => item.replace(/^"|"$/g, '').trim());
        }

        function switchTab(tabName, event) {
            currentTab = tabName;
            
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if(event && event.target) {
                event.target.classList.add('active');
            }

            renderCurrentTab();
        }

        function parseLocalDate(dateString) {
            if (!dateString) return null;
            let cleanStr = dateString.trim();
            
            let slashParts = cleanStr.split('/');
            if (slashParts.length === 3) {
                let d = parseInt(slashParts[0], 10);
                let m = parseInt(slashParts[1], 10) - 1;
                let y = parseInt(slashParts[2], 10);
                if (y > 2500) y -= 543; 
                if (y < 100) y += 2000; 
                let dateObj = new Date(y, m, d);
                if (!isNaN(dateObj.getTime())) return dateObj;
            }

            let dashParts = cleanStr.split('-');
            if (dashParts.length === 3) {
                let y = parseInt(dashParts[0], 10);
                let m = parseInt(dashParts[1], 10) - 1;
                let d = parseInt(dashParts[2], 10);
                if (y > 2500) y -= 543;
                let dateObj = new Date(y, m, d);
                if (!isNaN(dateObj.getTime())) return dateObj;
            }

            let fallback = new Date(cleanStr);
            return isNaN(fallback.getTime()) ? null : fallback;
        }

        function renderCurrentTab() {
            let today = new Date();
            today.setHours(0, 0, 0, 0);

            let filteredData = [];

            const getVal = (item, keyName) => {
                let foundKey = Object.keys(item).find(k => k.trim().toLowerCase() === keyName.toLowerCase());
                return foundKey ? item[foundKey] : '';
            };

            if (currentTab === 'today') {
                filteredData = allActivities.filter(item => {
                    let dateStr = getVal(item, 'Date');
                    let eventDate = parseLocalDate(dateStr);
                    if (!eventDate) return false;
                    eventDate.setHours(0, 0, 0, 0);
                    return eventDate.getTime() === today.getTime();
                });
            } else if (currentTab === 'archive') {
                filteredData = allActivities.filter(item => {
                    let dateStr = getVal(item, 'Date');
                    let eventDate = parseLocalDate(dateStr);
                    if (!eventDate) return false;
                    eventDate.setHours(0, 0, 0, 0);
                    return eventDate.getTime() < today.getTime();
                });
                filteredData.sort((a, b) => parseLocalDate(getVal(b, 'Date')) - parseLocalDate(getVal(a, 'Date')));
            }

            renderCards(filteredData);
        }

        function formatDate(dateString) {
            if (!dateString) return '-';
            let d = parseLocalDate(dateString);
            if (!d) return dateString;
            return d.toLocaleDateString('th-TH', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
        }

        function formatTime(timeString) {
            if (!timeString) return '-';
            return timeString.includes('น.') ? timeString : `${timeString} น.`;
        }

        function getActivityClass(activityName) {
            if (!activityName) return 'act-default';
            let name = activityName.toLowerCase();
            if (name.includes('battle royal')) return 'act-pk-battle';
            if (name.includes('super pk')) return 'act-super-pk';
            if (name.includes('family')) return 'act-family-pk';
            return 'act-default';
        }

        function getStatusInfo(status) {
            if (!status) return { text: 'รออัปเดต', class: 'status-waiting' };
            let s = status.trim();
            if (s.includes('สำเร็จ')) return { text: s, class: 'status-success' };
            if (s.includes('ได้ตารางแล้ว')) return { text: s, class: 'status-scheduled' };
            if (s.includes('ลงทะเบียนแล้ว') || s.includes('รอ')) return { text: s, class: 'status-waiting' };
            return { text: s, class: 'status-failed' };
        }

        function renderCards(data) {
            let cardList = document.getElementById("cardList");
            cardList.innerHTML = "";

            if (data.length === 0) {
                let emptyMsg = "ยังไม่มีคำขอลงกิจกรรมในวันนี้";
                if(currentTab === 'archive') emptyMsg = "ยังไม่มีประวัติกิจกรรมย้อนหลัง";

                cardList.innerHTML = `<div class="no-data">📌 ${emptyMsg}</div>`;
                return;
            }

            const getVal = (item, keyName) => {
                let foundKey = Object.keys(item).find(k => k.trim().toLowerCase() === keyName.toLowerCase());
                return foundKey ? item[foundKey] : '';
            };

            data.forEach(item => {
                let actName = getVal(item, 'ActivityName');
                let dateVal = getVal(item, 'Date');
                let timeVal = getVal(item, 'Time');
                let statusVal = getVal(item, 'Status');
                let nameVal = getVal(item, 'Name');
                let bigoIdVal = getVal(item, 'BigoID');
                let ourImgVal = getVal(item, 'OurImage');
                let oppIdVal = getVal(item, 'OpponentID');
                let oppAgencyVal = getVal(item, 'OpponentAgency');
                let oppImgVal = getVal(item, 'OpponentImage');

                let actClass = getActivityClass(actName);
                let statusInfo = getStatusInfo(statusVal);
                let formattedDate = formatDate(dateVal);
                let formattedTime = formatTime(timeVal);
                
                let ourAvatarHTML = ourImgVal 
                    ? `<img src="${ourImgVal}" alt="Our VJ" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'avatar-placeholder-cute\'>?</div>';">` 
                    : `<div class="avatar-placeholder-cute">?</div>`;

                let oppAvatarHTML = oppImgVal 
                    ? `<img src="${oppImgVal}" alt="Opponent VJ" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'avatar-placeholder-cute\'>?</div>';">` 
                    : `<div class="avatar-placeholder-cute">?</div>`;

                let cardHTML = `
                    <div class="activity-card">
                        <div class="card-top">
                            <span class="activity-badge ${actClass}">${actName || 'กิจกรรมทั่วไป'}</span>
                            <span style="font-size: 11px; color: var(--text-muted);">${formattedDate} | ${formattedTime}</span>
                        </div>

                        <div class="pk-match-container">
                            <!-- ฝั่งซ้าย: ของเรา (โทนอุ่น/ทอง) -->
                            <div class="vj-profile-side">
                                <div class="profile-avatar">${ourAvatarHTML}</div>
                                <div class="vj-info-details">
                                    <div class="vj-name" title="${nameVal || '-'}">${nameVal || '-'}</div>
                                    <div class="vj-id-row">
                                        ID: ${bigoIdVal || '-'} 
                                        ${bigoIdVal ? `<button class="copy-btn" onclick="copyToClipboard('${bigoIdVal}', this)" title="คัดลอก VJ ID">📋</button>` : ''}
                                    </div>
                                    <span class="agency-tag">MARS Agency</span>
                                </div>
                            </div>

                            <div class="vs-badge">VS</div>

                            <!-- ฝั่งขวา: คู่แข่ง (โทนเย็น/ฟ้า) -->
                            <div class="vj-profile-side opponent-side">
                                <div class="profile-avatar">${oppAvatarHTML}</div>
                                <div class="vj-info-details">
                                    <div class="vj-name" style="color: var(--text-muted);">คู่แข่ง</div>
                                    <div class="vj-id-row">
                                        ID: ${oppIdVal || '-'} 
                                        ${oppIdVal ? `<button class="copy-btn" onclick="copyToClipboard('${oppIdVal}', this)" title="คัดลอก ID คู่แข่ง">📋</button>` : ''}
                                    </div>
                                    <span class="agency-tag" style="color: #64b5f6; background: rgba(100, 181, 246, 0.1);">${oppAgencyVal || 'ระบุสังกัด'}</span>
                                </div>
                            </div>
                        </div>

                        <div class="card-bottom-grid">
                            <div class="status-badge ${statusInfo.class}">
                                ${statusInfo.text}
                            </div>
                        </div>
                    </div>
                `;
                cardList.innerHTML += cardHTML;
            });
        }

        function renderExternalLinks() {
            let container = document.getElementById("externalLinksContainer");
            if (!container) return;
            container.innerHTML = "";

            if (!externalLinks || externalLinks.length === 0) {
                container.innerHTML = `<div style="font-size: 11.5px; color: var(--text-muted); text-align: center;">ยังไม่มีลิงก์เพิ่มเติม</div>`;
                return;
            }

            externalLinks.forEach(link => {
                let linkHTML = `
                    <a href="${link.url}" target="_blank" class="external-link-card">
                        <span class="external-link-name">📌 ${link.name}</span>
                        <span class="external-link-icon">🔗 ไปยังลิงก์</span>
                    </a>
                `;
                container.innerHTML += linkHTML;
            });
        }

        function filterCards() {
            let keyword = document.getElementById("searchInput").value.toLowerCase();
            const getVal = (item, keyName) => {
                let foundKey = Object.keys(item).find(k => k.trim().toLowerCase() === keyName.toLowerCase());
                return foundKey ? item[foundKey] : '';
            };

            let filtered = allActivities.filter(item => {
                let name = getVal(item, 'Name').toLowerCase();
                let id = getVal(item, 'BigoID').toLowerCase();
                let oppId = getVal(item, 'OpponentID').toLowerCase();
                return name.includes(keyword) || id.includes(keyword) || oppId.includes(keyword);
            });
            renderCards(filtered);
        }

        function copyToClipboard(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                let originalHTML = btn.innerHTML;
                btn.innerHTML = "✅";
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                }, 1200);
            }).catch(err => {
                console.error('คัดลอกไม่สำเร็จ: ', err);
            });
        }

        window.onload = loadData;
    </script>
</body>
</html>
