<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมจับคู่ VJ MARS Agency</title>
    <!-- นำเข้า Supabase JS Client จาก CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- นำเข้าไลบรารี Canvas Confetti สำหรับทำเอฟเฟกต์พลุ -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0f172a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            position: relative;
        }

        /* ปุ่มกากบาทออกหน้าหลัก (มุมขวาบน) */
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #1e293b;
            color: #ef4444;
            border: 2px solid #ef4444;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .close-btn:hover {
            background-color: #ef4444;
            color: #fff;
            transform: scale(1.05);
        }

        h1 { color: #f8fafc; margin-bottom: 5px; font-size: 1.8rem; text-align: center; }

        /* ส่วนแสดงข้อมูลผู้เล่น */
        .player-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1e293b;
            padding: 6px 15px;
            border-radius: 20px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            border: 1px solid #334155;
        }
        .player-bar span { color: #38bdf8; font-weight: bold; }
        .edit-name-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: underline;
            padding: 0;
        }
        .edit-name-btn:hover { color: #fff; }

        .level-badge {
            background-color: #3b82f6;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .score-board { font-size: 0.95rem; margin-bottom: 20px; color: #94a3b8; text-align: center; }
        
        /* กระดานเกม */
        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            max-width: 480px;
            width: 100%;
        }

        /* ดีไซน์การ์ด */
        .card {
            aspect-ratio: 1 / 1;
            background: linear-gradient(135deg, #1e293b, #334155);
            border: 2px solid #475569;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s, background-color 0.2s;
        }
        .card:active { transform: scale(0.95); }
        
        .card.flipped {
            background: #ffffff;
            border-color: #38bdf8;
            cursor: default;
        }

        .card img {
            width: 85%;
            height: 85%;
            object-fit: cover;
            border-radius: 8px;
            display: none;
        }
        .card.flipped img { display: block; }
        
        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button.action-btn {
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .reset-btn { background-color: #475569; color: white; }
        .reset-btn:hover { background-color: #64748b; }

        /* Custom Modal สำหรับแจ้งผ่านด่าน (แทน Alert แบบเดิม) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
        }
        .modal-box {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 25px;
            border-radius: 16px;
            max-width: 360px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal-box h2 { color: #38bdf8; margin-top: 0; margin-bottom: 15px; }
        .modal-box p { color: #cbd5e1; margin-bottom: 20px; font-size: 0.95rem; line-height: 1.5; }
        .modal-btn {
            background-color: #22c55e;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .modal-btn:hover { background-color: #16a34a; }

        /* ส่วนแสดง Leaderboard */
        .leaderboard-container {
            margin-top: 35px;
            max-width: 480px;
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            box-sizing: border-box;
        }
        .leaderboard-container h3 {
            margin-top: 0;
            font-size: 1.1rem;
            color: #38bdf8;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th, td {
            padding: 8px;
            text-align: center;
            border-bottom: 1px solid #283548;
        }
        th { color: #94a3b8; font-weight: 600; }
        td:nth-child(2) { text-align: left; }
    </style>
</head>
<body>

    <!-- ปุ่มกากบาทออกหน้าหลัก -->
    <a href="index.html" class="close-btn" title="กลับหน้าแรก">✕</a>

    <h1>🎮 จับคู่ VJ MARS Agency</h1>

    <!-- แถบแสดงชื่อผู้เล่น -->
    <div class="player-bar">
        ผู้เล่น: <span id="player-name-display">ไม่ระบุชื่อ</span>
        <button class="edit-name-btn" onclick="promptChangeName()">[แก้ไขชื่อ]</button>
    </div>

    <div class="level-badge" id="level-title">Level 1 (4 คู่)</div>
    <div class="score-board">
        เวลา: <span id="timer">00:00</span> | จำนวนคลิก: <span id="clicks">0</span> | สำเร็จ: <span id="matches">0</span>/<span id="total-matches">4</span>
    </div>

    <div class="game-board" id="board"></div>

    <div class="btn-container">
        <button class="action-btn reset-btn" onclick="restartLevel()">เริ่มด่านนี้ใหม่</button>
    </div>

    <!-- Modal แจ้งเตือนเมื่อผ่านด่าน (หยุดเวลาเป๊ะๆ และสวยงาม) -->
    <div class="modal-overlay" id="level-modal">
        <div class="modal-box">
            <h2 id="modal-title">ผ่านด่านสำเร็จ!</h2>
            <p id="modal-desc">ยอดเยี่ยม! ไปลุยด่านถัดުރกันต่อเลย</p>
            <button class="modal-btn" id="modal-action-btn" onclick="handleModalAction()">ไปด่านถัดไป ➔</button>
        </div>
    </div>

    <!-- ตารางจัดอันดับ Leaderboard -->
    <div class="leaderboard-container">
        <h3>🏆 บอร์ดจัดอันดับสูงสุด (Top 10)</h3>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>ชื่อผู้เล่น</th>
                    <th>ด่านสูงสุด</th>
                    <th>คลิก</th>
                    <th>เวลา</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <tr><td colspan="5" style="color: #94a3b8;">กำลังโหลดข้อมูล...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // ----------------------------------------------------
        // 1. ตั้งค่าการเชื่อมต่อ Supabase
        // ----------------------------------------------------
        const SUPABASE_URL = 'https://ngdshyexremewbpnlrae.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_NcBG60jTTDqonaFiD1RwKw_etSq5A2o';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ----------------------------------------------------
        // 2. ข้อมูลเกมและรูปภาพ VJ (8 รูปทั้งหมด)
        // ----------------------------------------------------
        const allVjImages = [
            'images/vj1.png',
            'images/vj2.png',
            'images/vj3.png',
            'images/vj4.png',
            'images/vj5.png',
            'images/vj6.png',
            'images/vj7.png',
            'images/vj8.png'
        ];

        const levels = [
            { level: 1, pairs: 4, name: 'Level 1: ง่าย (4 คู่)' },
            { level: 2, pairs: 6, name: 'Level 2: ปานกลาง (6 คู่)' },
            { level: 3, pairs: 8, name: 'Level 3: ท้าทาย (8 คู่)' }
        ];

        let currentLevelIdx = 0;
        let cards = [];
        let flippedCards = [];
        let matchedCount = 0;
        let clickCount = 0;
        let playerName = '';
        
        // ตัวแปรจับเวลาและเก็บสถิติรวมตลอดการเล่น
        let timerInterval = null;
        let totalSeconds = 0;
        let totalClicksAccumulated = 0;
        let gameStarted = false;

        const board = document.getElementById('board');
        const clicksDisplay = document.getElementById('clicks');
        const matchesDisplay = document.getElementById('matches');
        const totalMatchesDisplay = document.getElementById('total-matches');
        const levelTitle = document.getElementById('level-title');
        const timerDisplay = document.getElementById('timer');
        const playerNameDisplay = document.getElementById('player-name-display');
        const levelModal = document.getElementById('level-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const modalActionBtn = document.getElementById('modal-action-btn');

        // จัดการชื่อผู้เล่นและแสดงกติกาตอนเริ่มต้น
        function initPlayer() {
            let savedName = localStorage.getItem('vj_game_player_name');
            if (!savedName || savedName.trim() === '') {
                alert('💡 กติกาเกม:\n- เกมนี้มีทั้งหมด 3 เลเวล (Level 1 - 3)\n- ระบบจะจับเวลาและนับคลิกต่อเนื่องยาวไปจนจบ Level 3\n- สถิติจะถูกส่งขึ้นบอร์ดจัดอันดับ (Leaderboard) เมื่อเล่นจบ Level 3 เท่านั้น!');
                savedName = prompt('กรุณาใส่ชื่อเล่นหรือฉายาของคุณ:', 'VJ_Player');
                if (!savedName || savedName.trim() === '') {
                    savedName = 'Anonymous';
                }
                localStorage.setItem('vj_game_player_name', savedName.trim());
            }
            playerName = savedName.trim();
            playerNameDisplay.innerText = playerName;
        }

        function promptChangeName() {
            let newName = prompt('เปลี่ยนชื่อเล่นใหม่:', playerName);
            if (newName && newName.trim() !== '') {
                playerName = newName.trim();
                localStorage.setItem('vj_game_player_name', playerName);
                playerNameDisplay.innerText = playerName;
            }
        }

        // เริ่มต้นด่าน พร้อมระบบสุ่มรูปภาพ (Randomized Images)
        function startLevel(levelIdx) {
            const levelConfig = levels[levelIdx];
            levelTitle.innerText = levelConfig.name;
            levelModal.style.display = 'none';
            totalMatchesDisplay.innerText = levelConfig.pairs;

            // สลับตำแหน่งรูปทั้งหมด แล้วตัดมาตามจำนวนคู่ของแต่ละเลเวล
            const shuffledAllImages = [...allVjImages].sort(() => Math.random() - 0.5);
            const selectedImages = shuffledAllImages.slice(0, levelConfig.pairs);

            // คูณสองเพื่อทำเป็นคู่ แล้วสลับตำแหน่งบนกระดาน
            cards = [...selectedImages, ...selectedImages].sort(() => Math.random() - 0.5);

            board.innerHTML = '';
            flippedCards = [];
            matchedCount = 0;
            clickCount = 0;
            clicksDisplay.innerText = clickCount;
            matchesDisplay.innerText = matchedCount;

            // ⚠️ [จุดที่เพิ่มเข้ามาตรงนี้ครับ] วนลูปสร้างการ์ดลงในบอร์ดเกม
            cards.forEach((imgUrl) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.value = imgUrl;
                card.innerHTML = `<img src="${imgUrl}" alt="VJ">`;
                card.addEventListener('click', flipCard);
                board.appendChild(card);
            });

            if (levelIdx === 0) {
                totalSeconds = 0;
                totalClicksAccumulated = 0;
                gameStarted = false;
                stopTimer();
                timerDisplay.innerText = '00:00';
            }
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                totalSeconds++;
                const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
                const s = (totalSeconds % 60).toString().padStart(2, '0');
                timerDisplay.innerText = `${m}:${s}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            gameStarted = false;
        }

        function flipCard() {
            if (!gameStarted) {
                startTimer();
            }
            if (flippedCards.length === 2 || this.classList.contains('flipped')) return;

            this.classList.add('flipped');
            flippedCards.push(this);

            if (flippedCards.length === 2) {
                clickCount++;
                totalClicksAccumulated++;
                clicksDisplay.innerText = clickCount;
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;

            if (card1.dataset.value === card2.dataset.value) {
                matchedCount++;
                matchesDisplay.innerText = matchedCount;
                flippedCards = [];

                if (matchedCount === levels[currentLevelIdx].pairs) {
                    // หยุดเวลาทันทีเมื่อเคลียร์ด่านสำเร็จ เพื่อความเที่ยงตรง
                    stopTimer();

                    setTimeout(() => {
                        if (currentLevelIdx < levels.length - 1) {
                            // ผ่านด่าน 1 หรือ 2
                            modalTitle.innerText = `🎉 ผ่าน Level ${levels[currentLevelIdx].level} แล้ว!`;
                            modalDesc.innerText = `เวลาสะสมตอนนี้: ${timerDisplay.innerText} | เตรียมตัวลุยด่านถัดไปกันต่อเลย`;
                            modalActionBtn.innerText = 'ไปด่านถัดไป ➔';
                            modalActionBtn.onclick = nextLevel;
                            levelModal.style.display = 'flex';
                        } else {
                            // ชนะด่านสุดท้าย (Level 3)
                            triggerConfetti();
                            modalTitle.innerText = `🏆 ยินดีด้วย! จบเกมครบทุกเลเวล`;
                            modalDesc.innerText = `เวลาวมทั้งหมด: ${timerDisplay.innerText} | บันทึกคะแนนลงบอร์ดเรียบร้อยแล้ว!`;
                            modalActionBtn.innerText = 'เล่นใหม่อีกครั้ง 🔄';
                            modalActionBtn.onclick = resetEntireGame;
                            levelModal.style.display = 'flex';

                            // ส่งคะแนนขึ้น Supabase ทันที
                            submitScoreToSupabase(levels[currentLevelIdx].level, totalClicksAccumulated, totalSeconds);
                        }
                    }, 400);
                }
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                }, 900);
            }
        }

        function restartLevel() {
            startLevel(currentLevelIdx);
        }

        function nextLevel() {
            if (currentLevelIdx < levels.length - 1) {
                currentLevelIdx++;
                startLevel(currentLevelIdx);
            }
        }

        function resetEntireGame() {
            currentLevelIdx = 0;
            startLevel(0);
        }

        // เอฟเฟกต์พลุฉลองตอนชนะด่านสุดท้าย
        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 150,
                    spread: 90,
                    origin: { y: 0.6 }
                });
            }
        }

        // ----------------------------------------------------
        // 3. ฟังก์ชันเชื่อมต่อ Supabase (บันทึกและดึง Leaderboard)
        // ----------------------------------------------------
        async function submitScoreToSupabase(maxLevel, clicks, timeSec) {
            try {
                const { error } = await supabaseClient
                    .from('vj_game_leaderboard')
                    .insert([
                        {
                            player_name: playerName,
                            max_level: maxLevel,
                            total_clicks: clicks,
                            total_time: timeSec
                        }
                    ]);

                if (error) {
                    console.error('Error inserting score:', error);
                } else {
                    fetchLeaderboard();
                }
            } catch (err) {
                console.error('Connection error:', err);
            }
        }

        async function fetchLeaderboard() {
            const tbody = document.getElementById('leaderboard-body');
            try {
                const { data, error } = await supabaseClient
                    .from('vj_game_leaderboard')
                    .select('*')
                    .order('max_level', { ascending: false })
                    .order('total_clicks', { ascending: true })
                    .order('total_time', { ascending: true })
                    .limit(10);

                if (error) {
                    tbody.innerHTML = `<tr><td colspan="5" style="color: #ef4444;">โหลดข้อมูลไม่สำเร็จ</td></tr>`;
                    return;
                }

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="color: #94a3b8;">ยังไม่มีประวัติคะแนน</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                data.forEach((row, index) => {
                    const m = Math.floor(row.total_time / 60).toString().padStart(2, '0');
                    const s = (row.total_time % 60).toString().padStart(2, '0');
                    const timeStr = `${m}:${s}`;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${escapeHtml(row.player_name)}</td>
                        <td>Lv.${row.max_level}</td>
                        <td>${row.total_clicks}</td>
                        <td>${timeStr}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error('Fetch error:', err);
                tbody.innerHTML = `<tr><td colspan="5" style="color: #ef4444;">เกิดข้อผิดพลาดในการเชื่อมต่อ</td></tr>`;
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // เริ่มต้นการทำงานเมื่อโหลดหน้าเว็บ
        initPlayer();
        startLevel(0);
        fetchLeaderboard();
    </script>
</body>
</html>
