<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เรตโบนัสสังกัด - MARS Agency</title>
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --gold-accent: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header-bar {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-btn {
            background: #334155;
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: #475569;
        }

        /* หน้ากระดาษแสดงผลหลัก (ยาวต่อเนื่อง รองรับมือถือและคอมพิวเตอร์) */
        .bonus-display-container {
            width: 100%;
            max-width: 900px;
            min-height: 80vh;
            background: #ffffff;
            color: #1e293b;
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
            overflow-x: auto;
        }

        /* ปรับแต่งการแสดงผลเนื้อหาภายในกระดาษ */
        .bonus-display-container img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 15px 0;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .bonus-display-container table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .bonus-display-container th, 
        .bonus-display-container td {
            border: 1px solid #cbd5e1;
            padding: 10px 12px;
            text-align: center;
            font-size: 15px;
        }

        .bonus-display-container th {
            background-color: #f1f5f9;
            color: #0f172a;
        }

        .loading-text, .error-text {
            text-align: center;
            color: var(--text-muted);
            margin-top: 100px;
            font-size: 16px;
        }

        /* Responsive สำหรับมือถือ */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .bonus-display-container {
                padding: 20px;
                min-height: 70vh;
            }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="index.html" class="back-btn">⬅️ กลับหน้าหลัก</a>
        <h2 style="margin: 0; font-size: 18px; color: var(--gold-accent);">📋 เรตโบนัสสังกัด MARS Agency</h2>
        <div style="width: 80px;"></div> <!-- เว้นพื้นที่ให้หัวข้ออยู่ตรงกลางพอดี -->
    </div>

    <!-- พื้นที่แสดงเนื้อหาหน้ากระดาษ -->
    <div id="publicBonusContent" class="bonus-display-container">
        <div class="loading-text">กำลังโหลดข้อมูลเรตโบนัส...</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ngdshyexremewbpnlrae.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_NcBG60jTTDqonaFiD1RwKw_etSq5A2o';
        
        let supabaseClient = null;
        if (window.supabase) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        async function loadPublicBonusPage() {
            const container = document.getElementById('publicBonusContent');
            if (!supabaseClient) {
                container.innerHTML = `<div class="error-text">ไม่พบการเชื่อมต่อฐานข้อมูล Supabase</div>`;
                return;
            }

            try {
                // ดึงข้อมูลจากตาราง agency_bonus_page แถวแรกที่บันทึกไว้
                const { data, error } = await supabaseClient
                    .from('agency_bonus_page')
                    .select('*')
                    .limit(1);

                if (error) throw error;

                if (data && data.length > 0 && data[0].content) {
                    container.innerHTML = data[0].content;
                } else {
                    container.innerHTML = `<div class="loading-text">ยังไม่มีข้อมูลเรตโบนัสในระบบ กรุณาให้แอดมินเข้ามาจัดการข้อมูล</div>`;
                }
            } catch (err) {
                console.error('Error loading bonus page:', err);
                container.innerHTML = `<div class="error-text">เกิดข้อผิดพลาดในการโหลดข้อมูลเรตโบนัส</div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadPublicBonusPage);
    </script>
</body>
</html>
